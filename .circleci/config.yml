version: 2.1

jobs:
  validate-static-app:
    docker:
      - image: cimg/node:22.11.0
    steps:
      - checkout
      - run:
          name: Check JavaScript syntax
          command: |
            set -euo pipefail
            find . -path "./.git" -prune -o -name "*.js" -print0 | xargs -0 -n 1 node --check
      - run:
          name: Verify Windows desktop wrapper
          command: |
            set -euo pipefail
            test -f package.json
            test -f desktop/main.js
            node -e "const pkg=require('./package.json'); if (!pkg.scripts['dist:win']) process.exit(1)"
      - run:
          name: Verify deployment folder
          command: |
            set -euo pipefail
            test -f netlify-public/index.html
            test -f netlify-public/netlify.toml
            for module in "初始介面" "主任" "教師" "總務" "財政" "檔案中心"; do
              test -f "netlify-public/${module}/index.html"
              test -f "netlify-public/${module}/app.js"
              test -f "netlify-public/${module}/styles.css"
            done
      - run:
          name: Ensure app files are synced
          command: |
            set -euo pipefail
            for module in "初始介面" "主任" "教師" "總務" "財政" "檔案中心"; do
              cmp "${module}/index.html" "netlify-public/${module}/index.html"
              cmp "${module}/app.js" "netlify-public/${module}/app.js"
              cmp "${module}/styles.css" "netlify-public/${module}/styles.css"
            done
            cmp index.html netlify-public/index.html
      - run:
          name: Build app artifact
          command: |
            set -euo pipefail
            mkdir -p dist
            tar -czf dist/cram-school-management-app.tar.gz -C netlify-public .
      - store_artifacts:
          path: dist
          destination: app-package

workflows:
  validate-and-package:
    jobs:
      - validate-static-app
