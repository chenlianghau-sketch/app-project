<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>補習班管理系統 - 總務行政</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="系統導覽">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">補</div>
          <div>
            <div class="brand-title">補習班管理</div>
            <div class="brand-subtitle">總務行政</div>
          </div>
        </div>

        <nav class="nav-list">
          <button class="nav-item active" type="button" aria-current="page">
            <span aria-hidden="true">□</span>
            備品庫存
          </button>
          <button class="nav-item" type="button" disabled>
            <span aria-hidden="true">↻</span>
            補貨紀錄
          </button>
          <button class="nav-item" type="button" disabled>
            <span aria-hidden="true">⚙</span>
            參數設定
          </button>
        </nav>

        <div class="sidebar-links">
          <a class="back-link" href="../檔案中心/index.html">檔案中心</a>
          <a class="back-link" href="../初始介面/index.html">返回初始介面</a>
        </div>

        <div class="sidebar-note">
          <strong>測試身分</strong>
          <span>william / 總務</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">General Affairs</p>
            <h1>備品清點與補貨提醒</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="resetDemoButton" type="button" title="重置示範資料" aria-label="重置示範資料">↺</button>
            <button class="primary-button" id="openAddDialog" type="button">
              <span aria-hidden="true">＋</span>
              新增備品
            </button>
          </div>
        </header>

        <section class="metrics" aria-label="庫存摘要">
          <div class="metric">
            <span class="metric-label">備品項目</span>
            <strong id="totalItems">0</strong>
          </div>
          <div class="metric warning">
            <span class="metric-label">需補貨</span>
            <strong id="lowItems">0</strong>
          </div>
          <div class="metric">
            <span class="metric-label">總庫存量</span>
            <strong id="totalQuantity">0</strong>
          </div>
          <div class="metric">
            <span class="metric-label">最後更新</span>
            <strong id="lastUpdated">--</strong>
          </div>
        </section>

        <section class="toolbar" aria-label="篩選工具">
          <label class="search-field">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜尋備品、教室或備註" autocomplete="off" />
          </label>

          <div class="segmented-control" role="group" aria-label="庫存狀態篩選">
            <button class="segment active" type="button" data-filter="all">全部</button>
            <button class="segment" type="button" data-filter="low">需補貨</button>
            <button class="segment" type="button" data-filter="ok">庫存足夠</button>
          </div>
        </section>

        <section class="alert-strip" id="alertStrip" aria-live="polite"></section>

        <section class="inventory-section" aria-label="備品清單">
          <div class="section-heading">
            <div>
              <h2>備品清單</h2>
              <p>數量低於各項目門檻時，系統會自動標示為需補貨。</p>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>備品</th>
                  <th>位置</th>
                  <th>數量</th>
                  <th>補貨門檻</th>
                  <th>狀態</th>
                  <th>備註</th>
                  <th class="actions-column">操作</th>
                </tr>
              </thead>
              <tbody id="inventoryBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="itemDialog">
      <form method="dialog" class="item-form" id="itemForm">
        <div class="dialog-header">
          <h2 id="dialogTitle">新增備品</h2>
          <button class="icon-button" type="button" id="closeDialog" aria-label="關閉">×</button>
        </div>

        <input type="hidden" id="itemId" />

        <label>
          備品名稱
          <input id="itemName" required maxlength="30" placeholder="例：白板筆" />
        </label>

        <label>
          教室/位置
          <input id="itemLocation" required maxlength="30" placeholder="例：A 教室" />
        </label>

        <div class="form-grid">
          <label>
            目前數量
            <input id="itemQuantity" required type="number" min="0" step="1" />
          </label>

          <label>
            補貨門檻
            <input id="itemThreshold" required type="number" min="0" step="1" />
          </label>
        </div>

        <label>
          備註
          <textarea id="itemNote" rows="3" maxlength="80" placeholder="例：黑色較常使用"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="secondary-button" type="button" id="cancelDialog">取消</button>
          <button class="primary-button" type="submit">儲存</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
